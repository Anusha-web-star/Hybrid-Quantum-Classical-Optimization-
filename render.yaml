# Render Blueprint for GRIDOPT.
#
# Two services: the FastAPI backend as a web service, the Vite dashboard as a
# static site. Create them together from this file (Render dashboard > Blueprints
# > New Blueprint Instance), then fill in the values marked `sync: false` - those
# are the ones Render deliberately refuses to read from a committed file, which is
# exactly where secrets belong.
#
# NOTHING SECRET IS IN THIS FILE, and nothing secret may be added to it: it is
# committed. Every credential is `sync: false`, meaning Render prompts for it once
# and stores it encrypted. The service-role key and the IBM token are never set on
# the static site, because a static site's environment is compiled into the
# browser bundle.
#
# See docs/DEPLOYMENT.md for what runs where, and what cannot run here at all.

services:
  # --------------------------------------------------------------------------
  # Backend - FastAPI over the existing Phase 1 / Phase 2 solvers.
  # --------------------------------------------------------------------------
  - type: web
    name: gridopt-api
    runtime: python
    plan: standard # 1 CPU / 2 GB. See docs/DEPLOYMENT.md: `free` is 0.1 CPU and
    # the hybrid QAOA solver is CPU-bound, so free turns an
    # 84-second run into many minutes. Drop to `starter` only
    # if you accept a slow /solve/hybrid.
    region: oregon
    branch: main
    healthCheckPath: /health

    # Installed from the repository root so phase1/ and phase2/ are importable -
    # backend/app/__init__.py puts the root on sys.path, and the solvers are used
    # as they are rather than copied.
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt

    # `--app-dir backend` matches the documented local command, so the deployed
    # process and the local one start the same application. One worker on
    # purpose: a hybrid run is CPU-bound, and a second worker on a 1-CPU plan
    # would make two concurrent runs slower than queueing them.
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7

      - key: APP_ENV
        value: production

      # The deployed dashboard's origin, so the browser is allowed to call this
      # API. Set it to the static site's URL once Render has assigned one
      # (https://gridopt-dashboard.onrender.com, or your custom domain).
      # Comma-separate several. localhost:5173 is always allowed by the backend
      # itself, so local development is unaffected by whatever is set here.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Token verification. "supabase" is the real gate: the browser signs in
      # with Supabase Auth and this server verifies each token's signature
      # against the project's public JWKS. "demo" admits every request without a
      # credential - it exists for running the API with no Supabase project
      # reachable and is NOT a security boundary, so it must not be set here.
      - key: AUTH_MODE
        value: supabase

      # Public. Used to locate the project's public JWKS and to check a token's
      # issuer. `sync: false` anyway, so the project URL is not committed.
      - key: SUPABASE_URL
        sync: false

      # Secret. Bypasses Row Level Security, so it lives only here, only on the
      # backend, and never in a VITE_ variable or on the static site.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Hybrid QAOA on shared vCPU. The solver, the algorithm and the defaults in
      # backend/app/core/config.py are all untouched - these override the default
      # sweep count and shots for this deployment only, because the full run
      # measures 84 s on a developer laptop and a hosted shared core is slower. A
      # request may still pass its own `sweeps`/`shots` and get the full run.
      # Delete both to deploy with the exact local defaults.
      - key: QAOA_SWEEPS
        value: "4"
      - key: QAOA_SHOTS
        value: "1024"

      # Assistant generation is NOT configured here, deliberately. It requires a
      # local Ollama server holding llama3.2:3b (~2 GB resident, CPU inference),
      # which no Render plan in this blueprint can host - and
      # backend/app/assistant/llm.py refuses any non-loopback OLLAMA_HOST by
      # design, so it cannot be pointed at a remote model either. Retrieval still
      # works on the deployed API (BM25 over the committed knowledge base) and
      # /assistant/query answers 503 `assistant_not_configured` with the exact
      # command that fixes it locally. docs/DEPLOYMENT.md explains the options.

      # IBM Quantum is not configured and qiskit-ibm-runtime is not installed.
      # Every run here uses the local Aer simulator; no hardware job is possible.

  # --------------------------------------------------------------------------
  # Frontend - the built Vite bundle, served as static files.
  # --------------------------------------------------------------------------
  - type: web
    name: gridopt-dashboard
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Absolute base for every API call. frontend/src/api/client.js already
      # reads this and falls back to relative URLs, so no source change was
      # needed - but it MUST be set here: without it the built bundle would
      # request /health from the static site's own origin, where nothing listens.
      # Set it to the backend's URL, no trailing slash:
      #   https://gridopt-api.onrender.com
      - key: VITE_API_BASE
        sync: false

      # Public by definition - everything VITE_-prefixed is compiled into the
      # bundle and served to every visitor. The publishable/anon key is designed
      # for that: it identifies the project and carries no authority of its own,
      # since what it may read or write is decided by Row Level Security.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      # The service-role key must NEVER appear on this service. It bypasses RLS,
      # and anything here ends up in a public JavaScript file.

    headers:
      # The hashed asset filenames Vite emits are immutable, so they can be
      # cached hard; index.html must not be, or a deploy would not be picked up.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache

    routes:
      # The dashboard is one page with no client-side router today, so this only
      # matters for a hard refresh on a deep link - it keeps that answering the
      # app instead of Render's 404.
      - type: rewrite
        source: /*
        destination: /index.html
